name: iPhone Duo pickup watch

# Same pattern as the Odyssey watcher: GitHub cron can't fire more often than every 5 min and is
# often late, so each run loops internally every ~30 s for ~5h45m, and a new run starts every
# 3 hours and takes over from the one going (see concurrency below); each run gets a fresh IP.
# Remove the schedule once Jake has the phone.
on:
  push:
    paths: ['duo/**', '.github/workflows/duo-watch.yml']
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write      # lets a blocked run start a fresh run on a new machine (new IP)
  contents: read

# 10/25: one run at a time. A blocked run hands off to a fresh run instead of ending, so every scheduled
# run and every push used to start another chain that never stopped (6 at once, 3-4 copies of each alert).
# Now the newest run (a hand-off, the schedule or a push) replaces the one going.
concurrency:
  group: duo-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Watch Apple pickup stock and push Jake's phone
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          GH_TOKEN: ${{ github.token }}
          DIAG_TOPIC: duo-diag-cd440587
        run: python3 duo/duo_watch.py
